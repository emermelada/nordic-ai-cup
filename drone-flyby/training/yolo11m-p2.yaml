# YOLO11-m with a P2/4 detection head, for the Drone Flyby small-object floor.
#
# THE FILENAME CARRIES THE SCALE. Ultralytics reads the variant from the stem
# (the `m` in yolo11m-p2), NOT from anything inside the file. Loading the
# scale-less `yolo11-p2.yaml` silently builds the NANO variant: 2.7M parameters
# and 10.5 GFLOPs, against yolo11m's ~20M -- and then `PRETRAINED=yolo11m.pt`
# warm-starts almost nothing, because the layer shapes do not match. It logs
# "warm-started from yolo11m.pt (2.7M param model)" and trains happily for
# hours. Caught 19 Sep, two minutes into a run. Always use a scaled filename.
#
# Stock YOLO11 detects at strides 8/16/32. At our served imgsz of 1280 on a
# Level-1 view, the finest stride of 8 is 12 SOURCE pixels per grid cell, and
# the per-class score follows how many cells an object spans almost exactly:
#
#   class            source px   cells @1280   AP      cells with P2
#   small_launcher        12.9          1.1    0.000        2.2
#   spacecraft            24.5          2.0    0.003        4.0
#   mine_roller           26.8          2.2    0.082        4.4
#   jammer                31.0          2.6    0.201        5.2
#   tank                  34.3          2.9    0.354        5.8
#   jet_plane             46.4          3.9    0.932        7.8
#   hangar               108.8          9.1    0.871       18.2
#
# Below ~2 cells nothing is ever found; above ~4 cells everything is. The whole
# contested band sits between, and it is 57% of scored object-frames. A P2 head
# at stride 4 doubles every number in that column.
#
# spacecraft is the target that matters most: it is worth 1/12 of the macro
# average (+0.041 if it reaches 0.50) and P2 puts it at 4.0 cells, the same band
# as jet_plane which scores 0.932. small_launcher reaches only 2.2 and may well
# stay dead -- do not judge this model on that class alone.
#
# Cost: the P2 grid has 4x the anchors of P3, so expect roughly 4x the anchors
# overall and a large jump in activation memory. BATCH must come down from the
# 12 that fits yolo11m at 1280 in 32 GB.

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
