# All three services; each machine only starts the ones it serves:
#   docker compose up -d --build medical-appointment
# GPU host (3060) adds the override:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build drone-flyby
x-common: &common
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api')"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  medical-appointment:
    <<: *common
    build: ./medical-appointment
    ports: ["8001:8000"]

  drone-flyby:
    <<: *common
    build: ./drone-flyby
    ports: ["8002:8000"]
    environment:
      DRONE_MODEL: /models/${DRONE_MODEL_FILE:-drone-yolo11n-v4.pt}
      # Second weights taking alternate frames; both feed one object memory,
      # so a run sees the union of what each can find. Unset = one model.
      DRONE_MODEL_ALT: ${DRONE_MODEL_ALT_FILE:+/models/${DRONE_MODEL_ALT_FILE}}
      # Recording is a per-run decision: several GB of PNG written during a
      # scored attempt costs answered frames. DRONE_RECORD=1 turns it on.
      DRONE_RECORD_DIR: ${DRONE_RECORD:+/recordings}
      # full (default, best on validation), quad0, full0, dwell, top, survey
      DRONE_CAMERA: ${DRONE_CAMERA:-full}
      # tracker experiments, e.g. DRONE_SET=MAX_MISSES=3,UNSEEN_DECAY=0.9
      DRONE_SET: ${DRONE_SET:-}
    volumes:
      - ${HOME}/models:/models:ro
      - ./drone-flyby/data/recordings:/recordings

  survival-simulator:
    <<: *common
    build: ./survival-simulator
    ports: ["8003:8000"]
